name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go to project folder
        run: |
          cd frontend/MyResume
          echo "=== Current directory: $(pwd) ==="
          ls -la

      - name: Install dependencies
        run: |
          cd frontend/MyResume
          npm install

      - name: Check svelte.config.js
        run: |
          cd frontend/MyResume
          echo "=== SVELTE CONFIG ==="
          cat svelte.config.js

      - name: Check package.json scripts
        run: |
          cd frontend/MyResume
          echo "=== PACKAGE.JSON SCRIPTS ==="
          cat package.json | grep -A 10 '"scripts"'

      - name: Try to build with verbose output
        run: |
          cd frontend/MyResume
          echo "=== STARTING BUILD ==="
          npm run build --verbose 2>&1 | tee build.log || true
          echo "=== BUILD LOG ==="
          cat build.log
          echo "=== EXIT CODE: $? ==="

      - name: Check what was built
        run: |
          cd frontend/MyResume
          echo "=== AFTER BUILD ==="
          ls -la
          echo "=== SEARCHING FOR BUILD FOLDERS ==="
          find . -type d -name "build" -o -name "dist" -o -name ".svelte-kit" | head -20
          
          # Create fallback if nothing found
          if [ ! -d "build" ] && [ ! -d "dist" ]; then
            echo "=== NO BUILD FOUND - CREATING FALLBACK ==="
            mkdir -p build
            echo "<h1>MyResume</h1>" > build/index.html
            echo "<p>Build failed - showing fallback</p>" >> build/index.html
            echo "<pre>" >> build/index.html
            cat build.log >> build/index.html 2>/dev/null || echo "No build log" >> build/index.html
            echo "</pre>" >> build/index.html
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/MyResume/build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

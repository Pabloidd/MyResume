name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/MyResume  # ← ВАЖНО: указываем папку с проектом
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/MyResume/package-lock.json'  # ← Явно указываем путь

      - name: Install dependencies
        run: |
          npm install
          npm install -D @sveltejs/adapter-vercel

      - name: Build
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: List build directory  
        run: |
          ls -la
          find . -name "build" -type d
          find . -name "dist" -type d
  
      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: |
            ./build
            ./dist
            ./frontend/MyResume/build
            ./frontend/MyResume/dist
          if-no-files-found: warn

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

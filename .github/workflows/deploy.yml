name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/MyResume
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/MyResume/package-lock.json'

      - name: Install dependencies
        run: |
          npm install
          npm install -D @sveltejs/adapter-static  # Используем static для GitHub Pages

      - name: Check svelte.config.js
        run: |
          echo "=== svelte.config.js content ==="
          cat svelte.config.js

      - name: Build project
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: Debug build output
        run: |
          echo "=== Current directory: $(pwd) ==="
          echo "=== Files in root ==="
          ls -la
          echo "=== Looking for build output ==="
          find . -type d \( -name "build" -o -name "dist" -o -name ".svelte-kit" \) | head -20
          echo "=== If build exists, show contents ==="
          if [ -d "build" ]; then
            echo "build folder found!"
            ls -la build/
          elif [ -d "dist" ]; then
            echo "dist folder found!"
            ls -la dist/
          elif [ -d ".svelte-kit/output" ]; then
            echo "svelte-kit output found!"
            ls -la .svelte-kit/output/
          else
            echo "❌ No build folder found!"
          fi

      - name: Determine build folder
        id: folder
        run: |
          if [ -d "build" ]; then
            echo "path=build" >> $GITHUB_OUTPUT
          elif [ -d "dist" ]; then
            echo "path=dist" >> $GITHUB_OUTPUT
          elif [ -d ".svelte-kit/output" ]; then
            echo "path=.svelte-kit/output" >> $GITHUB_OUTPUT
          else
            echo "path=." >> $GITHUB_OUTPUT
            echo "⚠️ No build folder found, using current directory"
          fi

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/MyResume/${{ steps.folder.outputs.path }}'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/MyResume
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Debug - list files
        run: |
          echo "=== Current directory ==="
          pwd
          echo "=== Files in project ==="
          ls -la
          echo "=== package.json content ==="
          cat package.json

      - name: Install dependencies
        run: npm install

      - name: Try to build
        run: npm run build || echo "Build failed but continuing"

      - name: Debug - find any output
        run: |
          echo "=== Searching for ANY build output ==="
          find . -type d -name "build" -o -name "dist" -o -name "output" | head -20
          echo "=== All directories ==="
          find . -type d | head -20
          echo "=== Creating manual build folder ==="
          mkdir -p ./build
          echo "<h1>Test</h1>" > ./build/index.html

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/MyResume/build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

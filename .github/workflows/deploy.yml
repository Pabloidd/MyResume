name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Go to project folder
        run: cd frontend/MyResume && pwd && ls -la

      - name: Install dependencies
        run: |
          cd frontend/MyResume
          npm install

      - name: Build
        run: |
          cd frontend/MyResume
          npm run build

      - name: Show what we have
        run: |
          cd frontend/MyResume
          echo "=== AFTER BUILD ==="
          ls -la
          echo "=== Looking for build/dist ==="
          find . -name "build" -type d
          find . -name "dist" -type d
          echo "=== Creating manual fallback ==="
          mkdir -p ./build
          echo "<h1>MyResume</h1>" > ./build/index.html
          echo "<p>Fallback page</p>" >> ./build/index.html

      - name: Upload from root
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/MyResume/build'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

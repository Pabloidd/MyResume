name: Deploy to GitHub Pages

on:
  push:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend/MyResume
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './frontend/MyResume/package-lock.json'

      - name: Install dependencies
        run: |
          npm install
          npm install -D @sveltejs/adapter-static

      - name: Build project
        env:
          BASE_PATH: '/${{ github.event.repository.name }}'
        run: npm run build

      - name: Debug build output
        run: |
          echo "=== Current directory: $(pwd) ==="
          echo "=== Files after build ==="
          ls -la
          echo "=== Looking for build folder ==="
          if [ -d "build" ]; then
            echo "✅ build folder found!"
            ls -la build/
            echo "path=build" > build-path.txt
          elif [ -d "dist" ]; then
            echo "✅ dist folder found!"
            ls -la dist/
            echo "path=dist" > build-path.txt
          elif [ -d ".svelte-kit/output" ]; then
            echo "✅ .svelte-kit/output folder found!"
            ls -la .svelte-kit/output/
            echo "path=.svelte-kit/output" > build-path.txt
          else
            echo "❌ No build folder found!"
            echo "path=." > build-path.txt
          fi
          cat build-path.txt

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './frontend/MyResume/build'  # Явно указываем полный путь от корня репо
